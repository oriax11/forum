<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/login_sty.css">
    <title>Report</title>
</head>
<body>
      <nav class="navbar">
       <a href="/"><img class="logo" src="static/img/logo.svg" alt="logo"></a>
      </nav>

    <div class="container">
        <form class="form" method="post">
            <p class="title">Report </p>
            <p class="message">Report the issues here, thanks</p>
            <label>
                <input required="" placeholder="Name" name="Name" type="text" class="input">
            </label> 
            <label>
                <input required="" placeholder="Email" name="email" type="email" class="input">
            </label> 
                
            <label>
                <textarea style="resize: none;" cols="40" placeholder="Message" name="message" class="input"></textarea>
            </label>
            <button class="submit">Report an issues</button>
        </form>
    </div>

</body>
</html>
